<!doctype html>
<html><head><meta charset="utf-8">
<!-- Source of hero.png. Render: "Google Chrome" --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=1.5 --window-size=1600,640 --screenshot=hero.png file://$PWD/hero.source.html -->
<style>
  html,body{margin:0;padding:0;background:#0b1220;}
  body{width:1600px;height:640px;overflow:hidden;font-family:-apple-system,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;}
  svg{display:block}
  .mono{font-family:"SF Mono",Menlo,Consolas,monospace}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <defs>
    <radialGradient id="glow" cx="1250" cy="320" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#0078d4" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0e1a33"/>
    </linearGradient>
    <linearGradient id="chain" x1="80" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#0078d4"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="640" fill="url(#bg)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- left: name and promise. Keep the tagline under ~55 characters. -->
  <text x="80" y="150" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="5">AZURE  ·  POWERSHELL</text>
  <text x="76" y="230" fill="#ffffff" font-size="72" font-weight="800" letter-spacing="-2">RiskyRolesAnalyzer</text>
  <text x="80" y="288" fill="#aab4c8" font-size="28" font-weight="400">Every privileged role assignment, hidden ones included.</text>
  <text x="80" y="330" fill="#6f7d99" font-size="21">Azure RBAC and Entra ID · nested groups · custom roles · dormant apps</text>
  <text x="80" y="362" fill="#6f7d99" font-size="21">Read-only · one self-contained HTML file · MIT</text>

  <g class="mono" font-size="19">
    <line x1="80" y1="470" x2="760" y2="470" stroke="url(#chain)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="470" r="9" fill="#0b1220" stroke="#38bdf8" stroke-width="3"/>
    <text x="80" y="510" fill="#8fd3ff" text-anchor="start" font-weight="600">Download</text>
    <circle cx="420" cy="470" r="9" fill="#0078d4" stroke="#38bdf8" stroke-width="3"/>
    <text x="420" y="510" fill="#8fb8ec" text-anchor="middle">Run</text>
    <circle cx="760" cy="470" r="9" fill="#22c55e" stroke="#86efac" stroke-width="3"/>
    <text x="760" y="510" fill="#86efac" text-anchor="end" font-weight="600">Report</text>
    <text x="80" y="548" fill="#55627d" font-size="17">One file. Nothing installed, nothing changed.</text>
  </g>

  <!-- right: what the blade lists, and what is behind each row -->
  <rect x="700" y="-200" width="1000" height="1000" fill="url(#glow)"/>

  <text x="900" y="132" class="mono" font-size="17" letter-spacing="2.4" fill="#6f86ab">THE BLADE LISTS</text>
  <text x="1180" y="132" class="mono" font-size="17" letter-spacing="2.4" fill="#8fd3ff">WHAT IS BEHIND IT</text>

  <!-- row 1 -->
  <rect x="900" y="156" width="232" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="920" y="188" font-size="19" fill="#c3d2e8">Global Administrator</text>
  <path d="M1140 182 H 1176" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1182" cy="182" r="4" fill="#ef4444"/>
  <rect x="1196" y="156" width="304" height="52" rx="10" fill="#2a0f14" stroke="#7f2a33" stroke-width="2"/>
  <text x="1214" y="180" class="mono" font-size="15" fill="#fca5a5">CRITICAL 9.5</text>
  <text x="1214" y="199" font-size="16" fill="#e2b8bc">an app with no valid credential</text>

  <!-- row 2 -->
  <rect x="900" y="230" width="232" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="920" y="262" font-size="19" fill="#c3d2e8">Owner</text>
  <path d="M1140 256 H 1176" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1182" cy="256" r="4" fill="#f59e0b"/>
  <rect x="1196" y="230" width="304" height="52" rx="10" fill="#2a1c08" stroke="#7a5a20" stroke-width="2"/>
  <text x="1214" y="254" class="mono" font-size="15" fill="#f0a52b">HIGH 7.0</text>
  <text x="1214" y="273" font-size="16" fill="#e0c68f">twelve people in a nested group</text>

  <!-- row 3 -->
  <rect x="900" y="304" width="232" height="52" rx="10" fill="#131f36" stroke="#26334d" stroke-width="2"/>
  <text x="920" y="336" font-size="19" fill="#c3d2e8">Directory Readers</text>
  <path d="M1140 330 H 1176" stroke="#3d5170" stroke-width="2" stroke-dasharray="5 5"/>
  <circle cx="1182" cy="330" r="4" fill="#8fd3ff"/>
  <rect x="1196" y="304" width="304" height="52" rx="10" fill="#0d2233" stroke="#2b5f80" stroke-width="2"/>
  <text x="1214" y="328" class="mono" font-size="15" fill="#8fd3ff">LOW 3.9</text>
  <text x="1214" y="347" font-size="16" fill="#a8c8dd">a disabled account that still holds it</text>

  <path d="M900 396 H 1500" stroke="#1e2a42" stroke-width="2"/>
  <text x="900" y="432" class="mono" font-size="17" fill="#6f86ab">Every row carries the command that fixes it.</text>
  <text x="900" y="458" class="mono" font-size="17" fill="#5d6f8f">Protected rows say why instead.</text>

</svg>
</body></html>
