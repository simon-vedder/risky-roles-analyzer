name: Release

# Builds the standalone script, tests it, and attaches it to a GitHub release when a version tag is
# pushed. The tag must match the manifest version (v0.1.0 for ModuleVersion 0.1.0); the job refuses
# otherwise.
#
# This workflow does not publish to the PowerShell Gallery. The tool ships as the single file
# dist/Invoke-RiskyRolesAudit.ps1 and is downloaded from main; see
# docs/decisions/0003-the-report-is-a-script-the-module-is-optional.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Test and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PowerShell modules
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          foreach ($m in 'PSScriptAnalyzer', 'Pester') { Install-Module $m -Force -Scope CurrentUser -SkipPublisherCheck }
          $manifest = Import-PowerShellDataFile ./src/RiskyRolesAnalyzer/RiskyRolesAnalyzer.psd1
          foreach ($required in @($manifest.RequiredModules)) {
            $name = if ($required -is [hashtable]) { $required.ModuleName } else { [string]$required }
            if ($name -and -not (Get-Module -ListAvailable $name)) { Install-Module $name -Force -Scope CurrentUser }
          }

      - name: Tag must match the manifest version
        id: manifest
        shell: pwsh
        run: |
          $manifest = Test-ModuleManifest ./src/RiskyRolesAnalyzer/RiskyRolesAnalyzer.psd1
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($tag -ne $manifest.Version.ToString()) { throw "Tag $tag does not match ModuleVersion $($manifest.Version)." }
          $prerelease = [string]$manifest.PrivateData.PSData.Prerelease
          $fullVersion = if ($prerelease) { "$($manifest.Version)-$prerelease" } else { $manifest.Version.ToString() }
          "prerelease=$([bool]$prerelease)".ToLowerInvariant() | Out-File $env:GITHUB_OUTPUT -Append
          "full_version=$fullVersion" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing $($manifest.Name) $fullVersion"

      - name: Analyze and test
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          if ($results) { $results | Format-Table -AutoSize; throw "PSScriptAnalyzer found $($results.Count) issue(s)." }
          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          Invoke-Pester -Configuration $config

      - name: The committed script must match its sources
        shell: pwsh
        run: ./tools/Build-StandaloneScript.ps1 -Check

      - name: Package the module sources for the release
        shell: pwsh
        run: Compress-Archive -Path ./src/RiskyRolesAnalyzer/* -DestinationPath ./dist/RiskyRolesAnalyzer-module-sources.zip

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: RiskyRolesAnalyzer ${{ steps.manifest.outputs.full_version }}
          prerelease: ${{ steps.manifest.outputs.prerelease == 'true' }}
          files: |
            dist/Invoke-RiskyRolesAudit.ps1
            dist/RiskyRolesAnalyzer-module-sources.zip
          generate_release_notes: true
